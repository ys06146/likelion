<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OraQ: experimental oral photo analysis and scan history.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="oral_health_ai">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OraQ</title>
  <link rel="manifest" href="manifest.json">

</head>
<body>
  <script>
    // Handle Google OAuth redirect in popup
    (function() {
      if (window.opener && window.location.hash) {
        var params = new URLSearchParams(window.location.hash.substring(1));
        var idToken = params.get('id_token');
        var state = params.get('state');
        var error = params.get('error');
        if (state && (idToken || error)) {
          window.history.replaceState(null, '', window.location.pathname);
          window.opener.postMessage(
            {type: 'google_id_token', id_token: idToken, state: state, error: error},
            window.location.origin
          );
          window.close();
          return;
        }
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
